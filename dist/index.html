      <main>
                <h1>SecureWatch - Real-Time Web Application &amp; API Security Dashboard</h1>
                <p>SecureWatch is a full-stack, real-time security operations dashboard developed by Kunal Kharat, Security Administrator, at Sandip Polytechnic, Sandip Foundation, Nashik, India.</p>
                <p>It provides real-time visibility into application health and attack vectors, with SIEM incident streaming, API telemetry, URL reputation, client-side cryptography, steganography, and password security analysis.</p>
        <h2>Security tools and intelligence</h2>
        <ul>
                    <li>SIEM incident streaming and a global cyber threat map using Supabase Realtime</li>
                    <li>URL reputation engine for phishing and malware domain detection with dynamic risk scoring</li>
                    <li>API gateway health and threat monitoring for latency, payload anomalies, and rate limits</li>
                    <li>Client-side AES-256 GCM encryption with Web Crypto API and SHA-256 integrity verification</li>
                    <li>LSB steganography, image analysis, and real-time password entropy assessment</li>
        </ul>
                <h2>Technology stack</h2>
                <p>Next.js, React, Tailwind CSS, Web Crypto API, and Supabase PostgreSQL, Auth, Realtime Database, and Row Level Security.</p>
        <p>JavaScript is required to use the interactive SecureWatch dashboard.</p>
        <p>Developed by <a href="https://www.linkedin.com/in/kunal-kharat-44a589400/">Kunal Kharat on LinkedIn</a>. View the <a href="https://github.com/kunalkharat774-ui/securewatch-dashboard">SecureWatch GitHub repository</a>.</p>
